<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Boule disco">
  <!-- Boule disco — charte Cadanse : warm-black + warm-white + gold -->
  <rect width="64" height="64" rx="10" fill="#0F0E0D" />

  <g fill="none" stroke="#F5F0E8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Suspension -->
    <line x1="32" y1="3.5" x2="32" y2="9.5" />
    <rect x="29.2" y="9.5" width="5.6" height="2.6" rx="0.5" />
    <line x1="32" y1="12.1" x2="32" y2="14.6" />
    <rect x="27.5" y="14.6" width="9" height="4.6" rx="1" />

    <!-- Boule -->
    <circle cx="32" cy="42" r="19" />

    <!-- Méridiens -->
    <line x1="32" y1="23" x2="32" y2="61" />
    <ellipse cx="32" cy="42" rx="9.5" ry="19" />

    <!-- Parallèles -->
    <ellipse cx="32" cy="42" rx="19" ry="4.2" />
    <ellipse cx="32" cy="33.5" rx="17" ry="2.8" />
    <ellipse cx="32" cy="50.5" rx="17" ry="2.8" />
    <ellipse cx="32" cy="27" rx="11.5" ry="1.9" />
    <ellipse cx="32" cy="57" rx="11.5" ry="1.9" />
  </g>

  <!-- Étoiles 4-branches en gold (au premier plan) -->
  <g fill="#D4A853">
    <path transform="translate(9 14)"
          d="M 0 -5.4 C 0 -1.9 1.9 -1.9 5.4 0 C 1.9 1.9 0 1.9 0 5.4 C 0 1.9 -1.9 1.9 -5.4 0 C -1.9 -1.9 0 -1.9 0 -5.4 Z" />
    <path transform="translate(55 13)"
          d="M 0 -5.4 C 0 -1.9 1.9 -1.9 5.4 0 C 1.9 1.9 0 1.9 0 5.4 C 0 1.9 -1.9 1.9 -5.4 0 C -1.9 -1.9 0 -1.9 0 -5.4 Z" />
    <path transform="translate(47 53)"
          d="M 0 -6 C 0 -2.1 2.1 -2.1 6 0 C 2.1 2.1 0 2.1 0 6 C 0 2.1 -2.1 2.1 -6 0 C -2.1 -2.1 0 -2.1 0 -6 Z" />
  </g>
</svg>
