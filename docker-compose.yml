services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_reservation: 256m
    mem_limit: 512m
    cpus: "1.0"

  migrate:
    image: ghcr.io/dejarn/cadanse/app:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    entrypoint: ["sh", "-c"]
    command:
      - "node prisma-modules/node_modules/prisma/build/index.js migrate deploy"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  app:
    image: ghcr.io/dejarn/cadanse/app:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - edge
    mem_reservation: 128m
    mem_limit: 512m
    cpus: "0.5"

networks:
  internal:
    internal: true
  # Shared with the external reverse-proxy stack; created on the host
  # (`docker network create edge`). Joining only — no proxy config here.
  edge:
    external: true
    name: edge

volumes:
  db_data:
