services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_reservation: 256m
    mem_limit: 512m
    cpus: "1.0"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/prisma-modules
    entrypoint: ["sh", "-c"]
    command:
      - "node node_modules/prisma/build/index.js migrate deploy --schema=/app/prisma/schema.prisma"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.cadanse.rule=Host(`${APP_HOST:?APP_HOST is required}`)
      - traefik.http.routers.cadanse.entrypoints=websecure
      - traefik.http.routers.cadanse.tls=true
      - traefik.http.routers.cadanse.tls.certresolver=letsencrypt
      - traefik.http.services.cadanse.loadbalancer.server.port=3000
    mem_reservation: 128m
    mem_limit: 512m
    cpus: "0.5"

networks:
  internal:
    internal: true
  traefik:
    external: true
    name: traefik

volumes:
  db_data:
