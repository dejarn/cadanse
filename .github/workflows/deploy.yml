name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy on Pi
    runs-on: [self-hosted, linux, arm64]
    environment: production
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      SUPER_ADMIN_USERNAME: ${{ secrets.SUPER_ADMIN_USERNAME }}
      SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
      APP_HOST: ${{ secrets.APP_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Start database
        run: docker compose up -d db --wait

      - name: Run migrations
        run: docker compose up migrate --abort-on-container-exit

      - name: Deploy app
        run: docker compose up -d app --remove-orphans --wait

      - name: Prune old images
        if: always()
        run: docker image prune -f
